# docker-compose utilisable en preprod locale ET en production.
# Prérequis : backend/.env créé à partir de backend/.env.example.
# Build  : docker compose build --no-cache
# Start  : docker compose up -d
# Logs   : docker compose logs -f backend

services:

  # ─── Backend (nginx + php-fpm via supervisord) ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    env_file:
      - ./backend/.env
    volumes:
      - backend_storage:/var/www/html/storage/app
    depends_on:
      - db
      - redis
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  # ─── App client (speedservice.bj) ──────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "3000:3000"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  # ─── Back-office admin (admin.speedservice.bj) ─────────────────────────────
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "3001:3001"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  # ─── App livreur PWA (driver.speedservice.bj) ──────────────────────────────
  driver:
    build:
      context: .
      dockerfile: driver/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "3002:3002"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  # ─── Base de données ────────────────────────────────────────────────────────
  # Lit POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD depuis backend/.env
  db:
    image: postgres:16-alpine
    env_file:
      - ./backend/.env
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  # ─── Cache / Queue ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5

volumes:
  db_data:
  backend_storage:
